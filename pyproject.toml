[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "tools/debug"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "SIM105", # contextlib.suppress over try/except/pass -- try/except reads fine here
    "B008",   # function call in argument default -- voluptuous schemas do this
    "RUF012", # HA entity classes use plain mutable class attrs by framework convention
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.13"
files = ["custom_components"]
# homeassistant ships its own types; the few third-party stubs we don't have
# (voluptuous extras) shouldn't fail the run.
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
exclude = ["tools/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:backoff.*",
    "ignore:Inheritance class HomeAssistantApplication:DeprecationWarning",
]
